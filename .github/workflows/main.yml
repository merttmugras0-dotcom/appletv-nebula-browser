
name: Build Nebula tvOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Find Xcode projects
        run: |
          find . \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print
